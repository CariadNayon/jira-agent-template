name: Agent checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python }} acceptance and regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install Python and dependencies
        run: uv sync --python ${{ matrix.python }}
      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Run offline acceptance and regression tests
        run: uv run pytest tests -q --junitxml=work/test-results.xml

  frontend:
    name: Tested Databricks frontend compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: uv sync --python 3.11
      - name: Prepare the same frontend used by the app
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          from scripts.start_app import ProcessManager
          from scripts.frontend_source import prepare_frontend
          if not ProcessManager().clone_frontend_if_needed():
              raise SystemExit(1)
          prepare_frontend(Path('e2e-chatbot-app-next'))
          PY
      - name: Build client and server from the upstream lockfile
        working-directory: e2e-chatbot-app-next
        run: |
          npm ci
          npm run build
