# Zentrale Standardwerte. App-Name, Secret und Warehouse stehen in databricks.yml (variables).
# Nutzer ändern Regeln, Modell und Tabellen persönlich über das Zahnrad.

jira:
  base_url: https://devstack.vwgroup.com/jira/rest/api/2

llm:
  supports_images: true                 # Azure-Deployment muss Bild-Eingaben unterstützen
  provider: azure_central                 # azure_central | azure_own (siehe jira_agent/llm.py)
  azure_endpoint: https://inc43errormana0783142845.cognitiveservices.azure.com/
  api_version: 2024-12-01-preview
  deployment: gpt-4o-2
  # Zentraler Team-Key: App-Ressource "secret" (AZURE_OPENAI_KEY), sonst Secret aus databricks.yml.

data:
  row_limit: 200                         # Zeilen pro Abfrage im Chat
  export_row_limit: 5000                 # Zeilen pro Export / Diagramm

agent:
  max_turns: 12
  enabled_tools: null                   # null = alle; alternativ Liste registrierter Tool-Namen
  default_rules: |
    - Frage nach, wenn Projekt oder notwendige Angaben fehlen.
    - Verwende die tatsächlichen Namen, Werte und Rechte aus Jira.
    - Schlage Änderungen nachvollziehbar vor und führe sie erst nach Bestätigung aus.

session:
  credentials_ttl_hours: 8               # Keys verfallen spätestens so lange nach Sitzungsbeginn (nur im Speicher)
  files_ttl_minutes: 60                  # erzeugte Diagramme/Exporte
