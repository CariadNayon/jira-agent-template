[project]
name = "jira-agent"
version = "0.1.0"
description = "Persönlicher Jira- und Daten-Assistent auf Databricks Apps (OpenAI Agents SDK, MLflow AgentServer)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.129.0",
    "uvicorn>=0.41.0",
    "databricks-openai>=0.13.0",
    "databricks-agents>=1.9.3",
    "mlflow>=3.10.0",
    "openai-agents>=0.4.1",
    "python-dotenv>=1.2.1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25.0",
    # Jira-Agent
    "requests>=2.31",
    "pyyaml>=6.0",
    "sqlglot>=25.0",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
    "pypdf>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_server", "jira_agent", "scripts"]

[dependency-groups]
dev = [
    "hatchling>=1.28.0",
    "pytest>=9.0.2",
]

setup = [
    "ruamel.yaml>=0.18.0",
]

[tool.uv]
# BEGIN synced constraints (.scripts/source/constraints.txt)
constraint-dependencies = [
    "certifi>=2026.10.18",
]
# END synced constraints
# Dependency cooldown: skip package versions published in the last 7 days (uv >= 0.9.17)
exclude-newer = "7 days"
default-groups = ["dev", "setup"]


[project.scripts]
quickstart = "scripts.quickstart:main"
start-app = "scripts.start_app:main"
start-server = "agent_server.start_server:main"
agent-evaluate = "agent_server.evaluate_agent:evaluate"
discover-tools = "scripts.discover_tools:main"
preflight = "scripts.preflight:main"
deploy = "scripts.deploy:main"
